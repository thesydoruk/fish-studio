# Fish Speech S2 Pro deploy config for vLLM-Omni (used by ./run.sh vllm start).
#
# Based on the bundled vllm_omni/deploy/fish_qwen3_omni.yaml.
# min_tokens keeps the slow AR from emitting EOS as the first token on
# Cyrillic. repetition_penalty 1.2 is enough to break syllable loops without
# flattening pitch. temperature 0.9 / top_p 0.8 / top_k 40 keeps non-human
# references from drifting into the human prior while still varying pitch.
# No fixed seed.
async_chunk: true
enable_chunked_prefill: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # ~21 Hz codec; 25 frames ≈ 1.16s of audio.
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      initial_codec_chunk_frames: 4

stages:
  - stage_id: 0
    # max_num_seqs is overridden at ./run.sh vllm start from fish_speech.max_concurrent_requests
    max_num_seqs: 6
    # Stages get independent budgets on the same GPU. 0.72 + stage 1 at 0.1
    # leaves ~2.5 GiB for DAC reference encodes, which sit outside the KV pool.
    gpu_memory_utilization: 0.72
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 16384
    max_model_len: 16384
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 40
      top_p: 0.8
      max_tokens: 2048
      min_tokens: 8
      repetition_penalty: 1.2

  - stage_id: 1
    # max_num_seqs is capped from fish_speech.max_concurrent_requests (max 6)
    max_num_seqs: 6
    # The codec stage measured ~2.5 GB in practice; the rest goes to stage 0.
    gpu_memory_utilization: 0.1
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 16384
    max_model_len: 16384
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
